[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclaw"
version = "0.1.0"
description = "统一智能体服务：Agent / RAG / Channels 三类能力的 FastAPI 后端与静态前端"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
    "deepagents[quickjs]>=0.7.42",
    "fastapi>=0.118.1,<0.119.0",
    "langchain>=1.5.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
    "tzdata>=2025.3",
    "langchain-openai>=1.8.5",
    "ag-ui-langgraph>=0.0.48",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "apscheduler>=3.11.0",
    "langchain-text-splitters>=1.2.0",
    "python-multipart>=0.0.20",
    "pandas>=3.0.2",
    "pgvector>=0.4.2",
    "matplotlib>=3.11.0",
    "casbin>=1.43.0",
    # 默认轻量向量库：SQLite 扩展，无需外部中间件
    "sqlite-vec>=0.1.9",
    # SQLAlchemy 异步扩展的必需运行时依赖，不声明时 pip 安装会直接 ImportError。
    "greenlet>=3.0.0",
    "croniter>=7.0.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pymupdf>=1.27.2.3",
    "pypdf2>=3.0.1",
    "pdfplumber>=0.11.9",
    "regex",
]
# uv add pypdf2 --optional pdf（原可选组配置示例）
# uv sync --extra pdf（旧安装命令仍可使用，PDF 依赖现在默认安装）
# uv sync --all-extras 安装所有可选依赖
[project.optional-dependencies]
# 保留旧部署命令的兼容入口，PDF 依赖已纳入默认安装。
pdf = []
# uv sync --extra graph-db 安装图数据库驱动
graph-db = [
    "neo4j>=6.2.0",
    "networkx",
]
docling = [
    "docling>=2.129.0,<3.0.0",
]
feishu = [
    "lark-oapi>=1.5.0,<2.0.0",
]
elasticsearch = [
    "elasticsearch==8.19.3",
]
web-fetch = [
    "crawl4ai>=0.8.0",
]
mem0 = [
    "mem0ai>=2.0.4",
]
oracle = ["oracledb>=2.0.0"]
opensandbox = [
    "opensandbox-server>=0.1.14",
    "opensandbox-code-interpreter>=0.1.2",
]
phoenix = [
    "arize-phoenix-otel>=0.16.1",
    "openinference-instrumentation-langchain>=0.1.66",
]
object-storage = [
    "boto3>=1.35.0",
]
## uv add pytest --group dev
# uv sync --no-dev  dev 组默认安装，可排除  
# uv sync --group lint   安装特定组 
# uv sync --all-groups 安装所有组  

[project.scripts]
deepclaw = "deepclaw.main:run"

# 只打包运行期需要的顶层包，避免把 frontend、desktop、tests 等目录当成包。
# mcp2tool 是 deepclaw.middleware.mcp 的运行时依赖，必须一起分发。
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["deepclaw*", "mcp2tool*"]

# RBAC 的模型与基础策略是运行期必需的数据文件，必须随 wheel 一起分发。
[tool.setuptools.package-data]
"deepclaw.web_backend.auth.rbac" = ["*.conf", "*.csv"]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.6.1", # 用于并行测试
    "networkx",
    "neo4j>=6.2.0",
    "tokenizers",
]
lint = ["ruff>=0.15.16"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["deepclaw"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportAttributeAccessIssue = false

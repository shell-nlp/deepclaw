[project]
name = "deepclaw"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "deepagents>=0.6.11",
    "elasticsearch==8.19.3",
    "fastapi>=0.115.0,<0.116.0",
    "langchain>=1.3.11",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-tavily>=0.2.17",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.40.0",
    "tzdata>=2025.3",
    "langchain-deepseek>=1.0.1",
    "crawl4ai>=0.8.0",
    "copilotkit>=0.1.93",
    "ag-ui-langgraph>=0.0.37",
    "ag-ui-protocol>=0.1.18",
    "langgraph-checkpoint-postgres>=3.0.4",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "apscheduler>=3.11.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.27.2.3",
    "pdfplumber>=0.11.9",
    "langchain-text-splitters>=1.1.2",
    "python-multipart>=0.0.20",
    "pandas>=3.0.2",
    "mem0ai>=2.0.4",
    "lark-oapi>=1.5.0,<2.0.0",
    "pgvector>=0.4.2",
    "neo4j>=6.2.0",
    "matplotlib>=3.11.0",
]
# uv add pypdf2 --optional pdf
# uv sync --extra pdf 才会安装
# uv sync --all-extras 安装所有可选依赖
[project.optional-dependencies]
oracle = ["oracledb>=2.0.0"]
opensandbox = [
    "opensandbox-server>=0.1.14",
    "opensandbox-code-interpreter>=0.1.2",
]
phoenix = [
    "arize-phoenix-otel>=0.16.1",
    "openinference-instrumentation-langchain>=0.1.66",
]
## uv add pytest --group dev
# uv sync --no-dev  dev 组默认安装，可排除  
# uv sync --group lint   安装特定组 
# uv sync --all-groups 安装所有组  

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.6.1", # 用于并行测试
]
lint = ["ruff>=0.15.16"]

# [tool.uv.sources]
# ag-ui-langgraph = { git = "https://github.com/ag-ui-protocol/ag-ui.git", subdirectory = "integrations/langgraph/python" }
# ag-ui-protocol = { git = "https://github.com/ag-ui-protocol/ag-ui.git", subdirectory = "sdks/python" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["deepclaw"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
reportAttributeAccessIssue = false
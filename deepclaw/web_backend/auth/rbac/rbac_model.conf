# Casbin 授权模型：RBAC 角色继承 + 资源归属 ABAC。
# r.sub / r.obj 由 rbac/enforcer.py 传入的属性对象求值：
#   r.sub.uid   主体用户 ID；r.sub.role 角色名；r.sub.is_admin 是否管理员
#   r.obj.owner 资源归属用户 ID，空字符串表示无归属资源
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub.role, p.sub) && r.act == p.act && keyMatch(r.obj.path, p.obj) && (r.sub.is_admin or r.obj.owner == "" or r.obj.owner == r.sub.uid)

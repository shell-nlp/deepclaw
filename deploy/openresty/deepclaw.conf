# DeepClaw 边缘网关配置示例（OpenResty / Nginx，http 上下文）
#
# 作用：
#   1. 统一入口，浏览器只看到网关域名，前后端同源，无需改前端代码
#   2. TLS、限流、上传体积、SSE 流式、WebSocket 升级在这一层处理
#   3. 后端只监听 127.0.0.1，不直接对外暴露
#
# 使用方式：放到 OpenResty/Nginx 的 conf.d 目录，替换域名与证书路径后
# 先执行 openresty -t（或 nginx -t）校验，再 reload。
# 要求后端 .env 中 HOST=127.0.0.1、PORT=7869。

# 登录接口限流：同一 IP 每分钟最多 10 次，避免暴力破解
limit_req_zone $binary_remote_addr zone=deepclaw_login:10m rate=10r/m;
# 创建 Run 接口限流：同一 IP 每分钟最多 60 次
limit_req_zone $binary_remote_addr zone=deepclaw_runs:10m rate=60r/m;

# WebSocket 升级头映射；普通请求置空以保留到上游的连接复用
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream deepclaw_backend {
    server 127.0.0.1:7869;
    keepalive 32;
}

server {
    listen 80;
    server_name deepclaw.example.com;
    # 生产环境建议直接 301 到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # Nginx/OpenResty 1.25.1+ 可追加 http2 on;
    server_name deepclaw.example.com;

    # TLS 证书：换成实际路径
    ssl_certificate     /etc/openresty/certs/deepclaw.crt;
    ssl_certificate_key /etc/openresty/certs/deepclaw.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 知识库上传大文件（PDF/PPT 等），限制请求体上限为 1G
    client_max_body_size 1g;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 以下代理参数在 server 级声明，所有 location 自动继承
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket：设备通道 /api/devices/connect 依赖这两个头
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # SSE：关闭缓冲，否则聊天回答会攒到最后一次性输出
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 健康检查：供网关自身与外部探活使用
    location = /health {
        proxy_pass http://deepclaw_backend;
        access_log off;
    }

    # 登录与注册接口加限流，降低爆破风险
    location = /api/auth/login {
        limit_req zone=deepclaw_login burst=5 nodelay;
        proxy_pass http://deepclaw_backend;
    }

    location = /api/auth/register {
        limit_req zone=deepclaw_login burst=5 nodelay;
        proxy_pass http://deepclaw_backend;
    }

    # 创建 Run 的写接口单独限流
    location = /api/agui/runs {
        limit_req zone=deepclaw_runs burst=20 nodelay;
        proxy_pass http://deepclaw_backend;
    }

    # 其余请求（含静态前端、SSE 事件流、设备 WebSocket）统一转发
    location / {
        proxy_pass http://deepclaw_backend;
    }
}
